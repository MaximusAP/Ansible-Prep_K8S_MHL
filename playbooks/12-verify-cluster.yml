---
- name: Verify Kubernetes cluster
  hosts: k8s-master-01
  become: yes
  tasks:
    - name: Show nodes
      become_user: "{{ ansible_user }}"
      shell: kubectl get nodes -o wide
      register: nodes
      changed_when: false

    - name: Print nodes
      debug:
        var: nodes.stdout_lines

    - name: Show pods
      become_user: "{{ ansible_user }}"
      shell: kubectl get pods -A
      register: pods
      changed_when: false

    - name: Print pods
      debug:
        var: pods.stdout_lines
