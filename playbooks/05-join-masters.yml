---
- name: Join additional control-plane nodes
  hosts: k8s-master-02,k8s-master-03
  become: yes
  tasks:
    - name: Check if node is already joined
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Read master join command from local file
      delegate_to: localhost
      become: no
      slurp:
        src: /tmp/k8s_master_join_command.sh
      register: master_join_command
      when: not kubelet_conf.stat.exists

    - name: Join node as control plane
      shell: "{{ master_join_command.content | b64decode }}"
      when: not kubelet_conf.stat.exists

    - name: Create kube config directory for admin user
      file:
        path: /home/{{ ansible_user }}/.kube
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Copy kubeconfig to admin user
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/{{ ansible_user }}/.kube/config
        remote_src: yes
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
      ignore_errors: yes
