---
- name: Install Calico CNI
  hosts: k8s-master-01
  become: yes
  tasks:
    - name: Install Calico networking
      become_user: "{{ ansible_user }}"
      shell: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/calico.yaml
      register: calico_apply
      changed_when: "'created' in calico_apply.stdout or 'configured' in calico_apply.stdout"
