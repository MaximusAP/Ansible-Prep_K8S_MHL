---
- name: Initialize Kubernetes cluster on first master
  hosts: k8s-master-01
  become: yes
  tasks:
    - name: Check if cluster is already initialized
      stat:
        path: /etc/kubernetes/admin.conf
      register: kubeadm_admin_conf

    - name: Initialize Kubernetes control plane
      shell: |
        kubeadm init \
          --control-plane-endpoint "{{ control_plane_endpoint }}" \
          --pod-network-cidr "{{ pod_network_cidr }}" \
          --upload-certs
      when: not kubeadm_admin_conf.stat.exists
      register: kubeadm_init_output

    - name: Create kube config directory for admin user
      file:
        path: /home/{{ ansible_user }}/.kube
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Copy kubeconfig to admin user
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/{{ ansible_user }}/.kube/config
        remote_src: yes
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Generate worker join command
      shell: kubeadm token create --print-join-command
      register: worker_join_command

    - name: Upload certs and capture certificate key
      shell: kubeadm init phase upload-certs --upload-certs | tail -1
      register: certificate_key

    - name: Save worker join command locally
      delegate_to: localhost
      become: no
      copy:
        dest: /tmp/k8s_worker_join_command.sh
        content: "{{ worker_join_command.stdout }}\n"

    - name: Save control-plane join command locally
      delegate_to: localhost
      become: no
      copy:
        dest: /tmp/k8s_master_join_command.sh
        content: "{{ worker_join_command.stdout }} --control-plane --certificate-key {{ certificate_key.stdout }}\n"
